<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Survival - Offline Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>⚔️ Battle Survival</h1>
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Health:</span>
                    <div class="health-bar">
                        <div class="health-fill" id="healthFill"></div>
                    </div>
                    <span class="stat-value" id="healthValue">100/100</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Score:</span>
                    <span class="stat-value" id="scoreValue">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Time:</span>
                    <span class="stat-value" id="timeValue">0s</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Enemies:</span>
                    <span class="stat-value" id="enemyValue">0</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="game-controls">
            <div class="control-info">
                <p><strong>Desktop:</strong> Arrow Keys or WASD to move, Space to attack</p>
                <p><strong>Touch:</strong> Swipe to move, tap to attack</p>
            </div>
            <button id="startBtn" class="btn-primary">Start Game</button>
            <button id="pauseBtn" class="btn-secondary" disabled>Pause</button>
            <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-content">
                <h2>Game Over!</h2>
                <div id="gameOverStats"></div>
                <button id="restartBtn" class="btn-primary">Play Again</button>
            </div>
        </div>

        <div id="pauseScreen" class="pause-screen hidden">
            <div class="pause-content">
                <h2>Paused</h2>
                <button id="resumeBtn" class="btn-primary">Resume</button>
                <button id="quitBtn" class="btn-secondary">Quit to Menu</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
